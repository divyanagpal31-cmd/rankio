[functions.lead-notify]
# Allow unauthenticated users to submit the one-time package enquiry form.
# The function uses the service role key internally to write to `leads`.
verify_jwt = false

[functions.contact-notify]
# Allow unauthenticated users to submit the contact form.
# The function uses the service role key internally to write to `contact_messages`.
verify_jwt = false

[functions.ensure-auth-user]
# Allows first-time email OTP users to be created as already confirmed before the OTP email is sent.
verify_jwt = false

[functions.paypal-checkout]
# Checkout is only available to authenticated users because the purchase is tied to their account.
verify_jwt = true

[functions.cancel-scan]
# Supports both authenticated and guest scan cancellation.
verify_jwt = false

[functions.callback-notify]
# Allow report viewers to request an implementation callback.
# The function uses the service role key internally to write to callback_requests.
verify_jwt = false

[functions.claim-visitor]
# Allow authenticated users to claim reports created during a logged-out scan.
verify_jwt = true

[auth.email]
otp_length = 8
otp_expiry = 300

[auth.email.template.magic_link]
subject = "Your One Time Password for Rankio"
content_path = "./supabase/templates/magic_link.html"
